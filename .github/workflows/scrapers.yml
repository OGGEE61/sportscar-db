name: Run Scrapers

on:
  schedule:
    # Run every day at 06:15 UTC (08:15 AM CEST Polish Summer Time / 07:15 AM CET Polish Winter Time)
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Cars to scrape'
        required: true
        default: 'rotation'
        type: choice
        options:
          - rotation
          - all
          - m3
          - m4
          - x3_m
          - c63
          - e55
          - rs3
          - rs4_b85
          - rs4_b9
          - rs4

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scrapers
      env:
        # Secret token for authentication with Vercel API
        API_TOKEN: ${{ secrets.API_TOKEN }}
        # The URL where the Vercel app is hosted (e.g. https://sportscar-db.vercel.app)
        BASE_URL: ${{ secrets.API_BASE }}
        # Otomoto session cookies to decrypt VINs (optional JSON string)
        OTOMOTO_COOKIES: ${{ secrets.OTOMOTO_COOKIES }}
        # Target selector: 'rotation' by default, or specific model / all
        SCRAPER_TARGET: ${{ github.event.inputs.target || 'rotation' }}
      run: |
        # Write cookies file if secret is provided
        if [ -n "$OTOMOTO_COOKIES" ]; then
          echo "$OTOMOTO_COOKIES" > scrapers/otomoto_cookies.json
        fi
        
        # Run scrapers (target controlled by SCRAPER_TARGET env var)
        python scrapers/run_all.py
