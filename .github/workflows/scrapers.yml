name: Run Scrapers

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scrapers
      env:
        # Secret token for authentication with Vercel API
        API_TOKEN: ${{ secrets.API_TOKEN }}
        # The URL where the Vercel app is hosted
        BASE_URL: ${{ secrets.API_BASE }}
        # Otomoto session cookies to decrypt VINs (JSON string)
        OTOMOTO_COOKIES: ${{ secrets.OTOMOTO_COOKIES }}
      run: |
        # Write cookies file if secret is provided
        if [ -n "$OTOMOTO_COOKIES" ]; then
          echo "$OTOMOTO_COOKIES" > scrapers/otomoto_cookies.json
        fi
        
        # Run all scrapers from the scrapers directory
        python scrapers/run_all.py || echo "Some scrapers failed, but continuing"
