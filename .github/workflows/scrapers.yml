name: Run Scrapers

on:
  schedule:
    # Run every 2 hours at :15 past the hour (12 runs per day, 1 model per run in continuous rotation)
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Cars to scrape'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - next_2
          - next_3
          - batch
          - all
          - m2
          - m2_f87
          - m2_g87
          - m3
          - m3_e46
          - m4
          - m5
          - m5_e39
          - 1m
          - 135i
          - z3_m
          - x3_m
          - x3_m40i
          - c63
          - e55
          - cls55
          - clk63
          - a45
          - gla45
          - g55
          - s55
          - sl55
          - cl55
          - rs3
          - rs4
          - rs4_b85
          - rs4_b9
          - r8
          - r8_v8
          - r8_v10
          - ttrs
          - cayman
          - cayman_gt4
          - macan
          - s2000
          - trx
          - raptor
          - patrol
          - gr_yaris
          - alpina

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scrapers
      env:
        # Secret token for authentication with Vercel API
        API_TOKEN: ${{ secrets.API_TOKEN }}
        # The URL where the Vercel app is hosted (e.g. https://sportscar-db.vercel.app)
        BASE_URL: ${{ secrets.API_BASE }}
        # Otomoto session cookies to decrypt VINs (optional JSON string)
        OTOMOTO_COOKIES: ${{ secrets.OTOMOTO_COOKIES }}
        # Target selector: 'single' (1 model slot) by default, or specific model / all
        SCRAPER_TARGET: ${{ github.event.inputs.target || 'single' }}
      run: |
        # Write cookies file if secret is provided
        if [ -n "$OTOMOTO_COOKIES" ]; then
          echo "$OTOMOTO_COOKIES" > scrapers/otomoto_cookies.json
        fi
        
        # Run scrapers (target controlled by SCRAPER_TARGET env var)
        python scrapers/run_all.py

    - name: Notify failure to SportsCar-DB
      if: failure()
      env:
        API_TOKEN: ${{ secrets.API_TOKEN }}
        BASE_URL: ${{ secrets.API_BASE }}
      run: |
        curl -s -X POST "$BASE_URL/api/log_run" \
          -H "Authorization: Bearer $API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"status\": \"error\", \"message\": \"GitHub Actions runner crashed or failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)\"}" || true
