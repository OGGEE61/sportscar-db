name: Run Autoplac Scrapers

on:
  schedule:
    # Twice a day; autoplac has few results per model and needs no cookies
    - cron: '15 7,19 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Autoplac cars to scrape'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x3_m40i

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Autoplac Scrapers
      env:
        API_TOKEN: ${{ secrets.API_TOKEN }}
        BASE_URL: ${{ secrets.API_BASE }}
        SCRAPER_TARGET: ${{ github.event.inputs.target || 'all' }}
      run: python scrapers/run_autoplac.py

    - name: Notify failure to SportsCar-DB
      if: failure()
      env:
        API_TOKEN: ${{ secrets.API_TOKEN }}
        BASE_URL: ${{ secrets.API_BASE }}
      run: |
        curl -s -X POST "$BASE_URL/api/log_run" \
          -H "Authorization: Bearer $API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"status\": \"error\", \"source\": \"autoplac\", \"message\": \"Autoplac Scrapers runner crashed or failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)\"}" || true
