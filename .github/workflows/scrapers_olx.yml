name: Run OLX Scrapers

on:
  schedule:
    # Every 4 hours at :45 (6 runs/day), each run scrapes a rotating window of 4 scrapers
    - cron: '45 */4 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'OLX Cars to scrape'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - next_4
          - alpina
          - x3m
          - x3_m40i
          - rs3
          - m3
          - m3_f80
          - m3_e46
          - m4
          - m2
          - m2_f87
          - m2_g87
          - c63
          - cayman
          - cayman_987
          - cayman_981
          - cayman_718
          - gt4
          - gr_yaris
          - s2000
          - rs4
          - rs4_b85
          - rs4_b9
          - a45
          - gla45
          - cl55
          - clk63
          - cls55
          - e55
          - g55
          - s55
          - sl55
          - r8_v8
          - r8_v10
          - ttrs
          - 1m
          - 135i
          - m5_e39
          - m5
          - z3_m
          - r8
          - macan

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run OLX Scrapers
      env:
        API_TOKEN: ${{ secrets.API_TOKEN }}
        BASE_URL: ${{ secrets.API_BASE }}
        OTOMOTO_COOKIES: ${{ secrets.OTOMOTO_COOKIES }}
        SCRAPER_TARGET: ${{ github.event.inputs.target || 'next_4' }}
      run: |
        if [ -n "$OTOMOTO_COOKIES" ]; then
          echo "$OTOMOTO_COOKIES" > scrapers/otomoto_cookies.json
        fi
        python scrapers/run_olx.py

    - name: Notify failure to SportsCar-DB
      if: failure()
      env:
        API_TOKEN: ${{ secrets.API_TOKEN }}
        BASE_URL: ${{ secrets.API_BASE }}
      run: |
        curl -s -X POST "$BASE_URL/api/log_run" \
          -H "Authorization: Bearer $API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"status\": \"error\", \"source\": \"olx\", \"message\": \"OLX Scrapers runner crashed or failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)\"}" || true
