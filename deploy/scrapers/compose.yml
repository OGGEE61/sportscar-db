# Scrapers on the VPS. Not a long-running service: cron starts one container per run (run.sh).
# Secrets live outside the repo, in /opt/sportscar-secrets (see README.md).
services:
  scraper:
    build:
      context: ../..
      dockerfile: deploy/scrapers/Dockerfile
    image: sportscar-scraper
    env_file: /opt/sportscar-secrets/scrapers.env   # API_TOKEN, BASE_URL
    environment:
      RUN_ORIGIN: VPS
      REVEAL_STATE_FILE: /app/state/reveal_state.json
    volumes:
      - /opt/sportscar-secrets/otomoto_cookies.json:/app/scrapers/otomoto_cookies.json:ro
      # the reveal budget shared by all runs: counts, the pause after a 403, ads that had none
      - /opt/sportscar-state:/app/state
